<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thanh Chọn Level & Topic Trượt Ngang Song Song</title>
    <!-- Tải thư viện Tailwind CSS chất lượng cao -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* CSS Loại bỏ hoàn toàn thanh cuộn ngang để giữ thẩm mỹ tối giản */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Hiệu ứng triệt tiêu vệt nhấp nháy màu xanh khi chạm trên màn hình di động */
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
            user-select: none;
        }

        /* Khóa chặt chiều cao để vừa vặn trong WebViewer 50px của App Inventor */
        html, body {
            margin: 0;
            padding: 0;
            height: 48px;
            overflow: hidden;
            background-color: transparent;
        }
    </style>
</head>
<body class="p-1 flex items-center justify-between overflow-hidden">

    <!-- CONTAINER CHÍNH CHỨA 3 VIEW TRƯỢT XOAY VÒNG -->
    <div class="relative w-full h-10 overflow-hidden rounded-xl bg-white shadow-sm border border-slate-100">
        
        <!-- ==================== VIEW 1: GIAO DIỆN CHÍNH (MAIN VIEW) ==================== -->
        <div id="main-view" class="absolute inset-0 w-full h-full px-2 flex items-center justify-between gap-1.5 transition-transform duration-300 transform translate-x-0">
            
            <!-- 1. NÚT LEVEL TRIGGER TRƯỢT SANG PHẢI (Chiếm 18% bề ngang) -->
            <button id="lvl-btn" onclick="slideInLevels()" class="w-[18%] shrink-0 h-8 font-black text-xs rounded-lg border flex items-center justify-center transition-all duration-200 active:scale-90 shadow-sm">
                B1
            </button>

            <!-- 2. NÚT CHỦ ĐỀ TRIGGER TRƯỢT SANG TRÁI (Chiếm 60% bề ngang) -->
            <button id="top-btn" onclick="slideInTopics()" class="w-[60%] flex-grow h-8 px-2 font-bold text-[11px] rounded-lg border flex items-center justify-between transition-all duration-200 active:scale-95 shadow-sm text-left">
                <span id="top-text" class="truncate">Select Topic...</span>
                <!-- Icon Sách mini chỉ báo nút bấm được -->
                <span class="text-xs shrink-0 ml-1">📖</span>
            </button>

            <!-- 3. NÚT KÍCH HOẠT SOẠN ĐỀ READ UP (Chiếm 22% bề ngang) -->
            <button onclick="sendSignalToMIT()" class="w-[22%] shrink-0 h-8 bg-rose-500 hover:bg-rose-600 active:scale-90 text-white font-black text-[10px] rounded-lg shadow-md shadow-rose-100 transition-all duration-150 flex items-center justify-center gap-0.5 tracking-wider">
                READ UP ⚡
            </button>
            
        </div>

        <!-- ==================== VIEW 2: DẢI TRÌNH ĐỘ TRƯỢT NGANG (LEVELS VIEW) ==================== -->
        <!-- Trượt từ bên trái sang (Mặc định nằm ẩn ở tọa độ -100%) -->
        <div id="levels-view" class="absolute inset-0 w-full h-full px-2 flex items-center gap-1.5 transition-transform duration-300 transform -translate-x-full bg-slate-50">
            <!-- Khay chứa 6 viên nang trình độ màu sắc rực rỡ -->
            <div id="levels-slider" class="flex-1 h-8 flex items-center gap-1.5 overflow-x-auto no-scrollbar scroll-smooth">
                <!-- Javascript sẽ tự động nạp 6 viên nang màu sắc rực rỡ vào đây -->
            </div>

            <!-- Nút quay lại View chính (Mũi tên phải) -->
            <button onclick="slideOutLevels()" class="w-7 h-7 shrink-0 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-xs rounded-full flex items-center justify-center active:scale-90 transition-all duration-150">
                →
            </button>
        </div>

        <!-- ==================== VIEW 3: DẢI CHỦ ĐỀ TRƯỢT NGANG KHÔNG GIỚI HẠN (TOPICS VIEW) ==================== -->
        <!-- Trượt từ bên phải sang (Mặc định nằm ẩn ở tọa độ 100%) -->
        <div id="topics-view" class="absolute inset-0 w-full h-full px-2 flex items-center gap-1.5 transition-transform duration-300 transform translate-x-full bg-slate-50">
            <!-- Nút quay lại View chính (Mũi tên trái) -->
            <button onclick="slideOutTopics()" class="w-7 h-7 shrink-0 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-xs rounded-full flex items-center justify-center active:scale-90 transition-all duration-150">
                ←
            </button>

            <!-- Khay trượt chứa 30 chủ đề độc lập phân bổ màu sắc và vệt đứt ngăn cách -->
            <div id="topics-slider" class="flex-1 h-8 flex items-center gap-1.5 overflow-x-auto no-scrollbar scroll-smooth">
                <!-- Javascript sẽ tự động nạp 30 viên nang màu sắc rực rỡ vào đây -->
            </div>
        </div>

    </div>

    <!-- HỆ THỐNG KỊCH BẢN ĐIỀU PHỐI DỮ LIỆU ĐỘNG CHỐNG CRASH -->
    <script>
        var levels = ["A1", "A2", "B1", "B2", "C1", "C2"];
        var currentLevel = "Level"; // Mặc định ban đầu
        var currentTopic = "Topic"; // Mặc định ban đầu

        // Danh sách 30 bài học được phân định bằng 3 gam màu đặc trưng chuẩn sách Global Success
        var topics = [
            // Lớp 10 (Deep Teal Theme)
            { name: "Family Life", grade: 10 },
            { name: "Humans and the Environment", grade: 10 },
            { name: "Music", grade: 10 },
            { name: "For a Better Community", grade: 10 },
            { name: "Inventions", grade: 10 },
            { name: "Gender Equality", grade: 10 },
            { name: "Viet Nam and International Organisations", grade: 10 },
            { name: "New Ways to Learn", grade: 10 },
            { name: "Protecting the Environment", grade: 10 },
            { name: "Ecotourism", grade: 10 },

            // Lớp 11 (Royal Purple Theme)
            { name: "A Long and Healthy Life", grade: 11 },
            { name: "The Generation Gap", grade: 11 },
            { name: "Cities of the Future", grade: 11 },
            { name: "ASEAN and Viet Nam", grade: 11 },
            { name: "Global Warming", grade: 11 },
            { name: "Preserving Our Heritage", grade: 11 },
            { name: "Education Options for School Leavers", grade: 11 },
            { name: "Becoming Independent", grade: 11 },
            { name: "Social Issues", grade: 11 },
            { name: "The Ecosystem", grade: 11 },

            // Lớp 12 (Rose Pink Theme)
            { name: "Life Stories we Admire", grade: 12 },
            { name: "A Cultural Identity", grade: 12 },
            { name: "Green Living", grade: 12 },
            { name: "Urbanisation", grade: 12 },
            { name: "The World of Work", grade: 12 },
            { name: "Artificial Intelligence", grade: 12 },
            { name: "The World of Higher Education", grade: 12 },
            { name: "Lifelong Learning", grade: 12 },
            { name: "Choosing a Career", grade: 12 },
            { name: "Lifelong Skills", grade: 12 }
        ];

        // Khởi tạo khay trượt Trình độ (Levels Slider)
        function initLevelsSlider() {
            var slider = document.getElementById("levels-slider");
            slider.innerHTML = "";

            levels.forEach(function(lvl) {
                var btn = document.createElement("button");
                btn.type = "button";
                btn.className = "px-3.5 h-7 shrink-0 text-xs font-black rounded-lg border transition-all duration-150 active:scale-95 shadow-sm ";
                btn.innerText = lvl;

                // Tô màu sắc đặc trưng theo nhóm cấp độ CEFR
                if (lvl === "A1" || lvl === "A2") {
                    btn.className += "bg-amber-50 border-amber-200 hover:bg-amber-100 text-amber-700";
                } else if (lvl === "B1" || lvl === "B2") {
                    btn.className += "bg-indigo-50 border-indigo-200 hover:bg-indigo-100 text-indigo-700";
                } else if (lvl === "C1" || lvl === "C2") {
                    btn.className += "bg-pink-50 border-pink-200 hover:bg-pink-100 text-pink-700";
                }

                btn.onclick = function() {
                    selectLevel(lvl);
                };

                slider.appendChild(btn);
            });
        }

        // Khởi tạo khay trượt Chủ đề (Topics Slider)
        function initTopicsSlider() {
            var slider = document.getElementById("topics-slider");
            slider.innerHTML = "";

            topics.forEach(function(item, index) {
                var btn = document.createElement("button");
                btn.type = "button";
                
                // Thiết lập cấu trúc cơ bản cho viên nang chủ đề
                btn.className = "px-3 h-7 shrink-0 text-[10px] font-black rounded-lg border transition-all duration-150 active:scale-95 shadow-sm ";
                btn.innerText = item.name;

                // Áp đặt màu sắc thiết kế riêng biệt cho từng khối lớp
                if (item.grade === 10) {
                    btn.className += "bg-teal-50 border-teal-200 hover:bg-teal-100 text-teal-800";
                } else if (item.grade === 11) {
                    btn.className += "bg-violet-50 border-violet-200 hover:bg-violet-100 text-violet-800";
                } else if (item.grade === 12) {
                    btn.className += "bg-pink-50 border-pink-200 hover:bg-pink-100 text-pink-800";
                }

                btn.onclick = function() {
                    selectTopic(item.name, item.grade);
                };

                slider.appendChild(btn);

                // Chèn vệt đứt mờ nhã nhặn phân cách sau mỗi 10 bài học để tối ưu diện tích
                if (index === 9 || index === 19) {
                    var divider = document.createElement("span");
                    divider.className = "text-slate-300 font-bold select-none px-1 text-xs shrink-0";
                    divider.innerText = "┈";
                    slider.appendChild(divider);
                }
            });
        }

        // Các hàm xử lý trượt hai chiều mượt mà
        function slideInLevels() {
            document.getElementById("main-view").style.transform = "translateX(100%)";
            document.getElementById("levels-view").style.transform = "translateX(0)";
        }

        function slideOutLevels() {
            document.getElementById("main-view").style.transform = "translateX(0)";
            document.getElementById("levels-view").style.transform = "-translateX(100%)";
            document.getElementById("levels-view").style.transform = "translateX(-100%)";
        }

        function slideInTopics() {
            document.getElementById("main-view").style.transform = "translateX(-100%)";
            document.getElementById("topics-view").style.transform = "translateX(0)";
        }

        function slideOutTopics() {
            document.getElementById("main-view").style.transform = "translateX(0)";
            document.getElementById("topics-view").style.transform = "translateX(100%)";
        }

        // Hàm chạm chọn Trình độ
        function selectLevel(lvl) {
            currentLevel = lvl;
            
            var lvlBtn = document.getElementById("lvl-btn");
            lvlBtn.innerText = lvl;

            // Đổi màu sắc nút Level theo nhóm trình độ được chọn cực kỳ sang trọng
            if (lvl === "A1" || lvl === "A2") {
                lvlBtn.className = "w-[18%] shrink-0 h-8 font-black text-xs rounded-lg border flex items-center justify-center transition-all duration-200 active:scale-90 shadow-sm bg-amber-50 border-amber-300 text-amber-700";
            } else if (lvl === "B1" || lvl === "B2") {
                lvlBtn.className = "w-[18%] shrink-0 h-8 font-black text-xs rounded-lg border flex items-center justify-center transition-all duration-200 active:scale-90 shadow-sm bg-indigo-50 border-indigo-300 text-indigo-700";
            } else if (lvl === "C1" || lvl === "C2") {
                lvlBtn.className = "w-[18%] shrink-0 h-8 font-black text-xs rounded-lg border flex items-center justify-center transition-all duration-200 active:scale-90 shadow-sm bg-rose-50 border-rose-300 text-rose-700";
            }

            // Trượt quay về màn hình chính
            slideOutLevels();
        }

        // Hàm chạm chọn Chủ đề
        function selectTopic(name, grade) {
            currentTopic = name;
            
            var textEl = document.getElementById("top-text");
            textEl.innerText = name;

            var topBtn = document.getElementById("top-btn");

            // Cập nhật màu sắc nút chủ đề chính khớp đồng bộ với khối màu khối lớp
            if (grade === 10) {
                topBtn.className = "w-[60%] flex-grow h-8 px-2 font-bold text-[11px] rounded-lg border flex items-center justify-between transition-all duration-200 active:scale-95 shadow-sm text-left bg-teal-50 border-teal-200 text-teal-800";
            } else if (grade === 11) {
                topBtn.className = "w-[60%] flex-grow h-8 px-2 font-bold text-[11px] rounded-lg border flex items-center justify-between transition-all duration-200 active:scale-95 shadow-sm text-left bg-violet-50 border-violet-200 text-violet-800";
            } else if (grade === 12) {
                topBtn.className = "w-[60%] flex-grow h-8 px-2 font-bold text-[11px] rounded-lg border flex items-center justify-between transition-all duration-200 active:scale-95 shadow-sm text-left bg-pink-50 border-pink-200 text-pink-800";
            }

            // Trượt quay về màn hình chính
            slideOutTopics();
        }

        // Hàm phát tín hiệu mật mã truyền về MIT App Inventor
        function sendSignalToMIT() {
            var level = currentLevel;
            var topic = currentTopic;
            
            // Biên dịch chuỗi mật mã chỉ thị cho MIT
            var message = "COMPASS:SOAN|" + level + "|" + topic;
            
            if (window.AppInventor && window.AppInventor.setWebViewString) {
                window.AppInventor.setWebViewString(message);
            } else {
                // Giả lập giao tiếp kiểm tra trên trình duyệt PC
                console.log("Mock Signal Sent: ", message);
                var btn = document.querySelector("button[onclick='sendSignalToMIT()']");
                btn.classList.add("opacity-50");
                setTimeout(function() {
                    btn.classList.remove("opacity-50");
                }, 150);
            }
        }

        // Tự động nạp dữ liệu ban đầu khi khởi chạy
        window.onload = function() {
            initLevelsSlider();
            initTopicsSlider();
            
            // Thiết lập giá trị mặc định lúc đầu là B1 và Family Life (Lớp 10 - Màu Teal)
            selectLevel("B1");
            selectTopic("Family Life", 10);
        };
    </script>
</body>
</html>
