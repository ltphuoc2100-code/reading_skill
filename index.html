<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Reading Practice (Connection Test)</title>
    <!-- Nhúng Tailwind CSS hỗ trợ thiết kế giao diện di động tuyệt đẹp -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tap-scale:active {
            transform: scale(0.97);
        }
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background-color: #4b5563;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header ứng dụng -->
    <header class="bg-slate-900 border-b border-slate-800 py-3.5 px-4 sticky top-0 z-20 shadow-lg">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="p-2 bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 rounded-xl">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </span>
                <div>
                    <h1 class="text-xs font-bold tracking-wide text-white">Khảo Thí Đọc Hiểu</h1>
                    <p class="text-[10px] text-emerald-400 font-semibold">Chế độ kiểm tra kết nối (Không cần API Key)</p>
                </div>
            </div>
            
            <div id="status-badge" class="flex items-center space-x-1.5 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-1 rounded-full text-[9px] font-semibold text-emerald-400">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="status-badge-text">ĐÃ THÔNG LUỒNG</span>
            </div>
        </div>
    </header>

    <!-- Màn hình tương tác chính -->
    <main class="flex-1 max-w-md mx-auto w-full p-4 space-y-4 flex flex-col justify-start overflow-y-auto">

        <!-- THẺ TRẠNG THÁI HIỂN THỊ KẾT NỐI -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-md space-y-3">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Hộp Thử Nghiệm Tín Hiệu:</h2>
            <div class="grid grid-cols-2 gap-2">
                <div class="bg-slate-950 p-3 rounded-xl border border-slate-850 text-center">
                    <p class="text-[9px] text-slate-500 font-bold uppercase">Trình độ nhận được</p>
                    <p class="text-lg font-black text-indigo-400 mt-1" id="received-level">--</p>
                </div>
                <div class="bg-slate-950 p-3 rounded-xl border border-slate-850 text-center">
                    <p class="text-[9px] text-slate-500 font-bold uppercase">Chủ đề nhận được</p>
                    <p class="text-xs font-extrabold text-indigo-400 mt-2 truncate" id="received-topic">Chưa có tín hiệu</p>
                </div>
            </div>
            <div id="status" class="text-[11px] text-center text-amber-400 font-medium">🔄 Đang liên tục quét tín hiệu từ MIT App Inventor...</div>
        </div>

        <div id="quizArea" class="space-y-4"></div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 text-slate-600 text-center py-4 text-[10px] border-t border-slate-900 uppercase tracking-widest">
        MIT App Inventor Bridge Active
    </footer>

    <script>
        let currentLevel = "";
        let currentTopic = "";
        let quizData = null;
        let lastReceivedConfig = "";

        // 🎯 BỘ NHẬN TÍN HIỆU SIÊU CẤP - THÁCH THỨC MỌI DẠNG BLOCKS
        function parseParameters() {
            let level = "Chưa nhận";
            let topic = "Chưa nhận";

            // Cách 1: Đọc từ tham số URL thực tế của trình duyệt (Dành cho GoToUrl)
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get("level")) level = urlParams.get("level").trim();
            if (urlParams.get("topic")) topic = urlParams.get("topic").trim();

            // Cách 2: Đọc từ WebViewString (Dành cho set WebViewString)
            if (window.AppInventor && window.AppInventor.getWebViewString) {
                const wvs = window.AppInventor.getWebViewString();
                if (wvs && wvs.trim() !== "") {
                    // TRƯỜNG HỢP ĐẶC BIỆT: Nếu dán cả link URL chứa ?level= vào WebViewString
                    if (wvs.includes("?")) {
                        const queryString = wvs.split("?")[1];
                        if (queryString) {
                            const tempParams = new URLSearchParams(queryString);
                            if (tempParams.get("level")) level = tempParams.get("level").trim();
                            if (tempParams.get("topic")) topic = tempParams.get("topic").trim();
                        }
                    } 
                    // TRƯỜNG HỢP CHUẨN: Nếu truyền dạng gạch đứng "B1|Technology"
                    else if (wvs.includes("|")) {
                        const parts = wvs.split("|");
                        level = parts[0].trim();
                        topic = parts[1].trim();
                    }
                }
            }

            // Làm sạch các ký tự đặc biệt nếu có lỗi gõ phím
            level = level.replace(/[^a-zA-Z0-9]/g, ""); 
            topic = topic.trim();

            return { level, topic };
        }

        // ĐỘNG CƠ SINH ĐỀ THI MÔ PHỎNG DYNAMIC OFFLINE (Chứng minh kết nối thành công)
        function generateLocalMockQuiz(level, topic) {
            const simulatedTitle = `Exam Study: ${topic} (Level ${level})`;
            const simulatedPassage = `This special test passage is dynamically compiled for English proficiency <b>${level}</b> focusing on the core subject of <b>${topic}</b>. In this study, we explore how <b>${topic}</b> interacts with modern learners at the <b>${level}</b> scale. Historically, research in <b>${topic}</b> was limited. However, modern educational technologies have greatly enhanced our understanding of <b>${topic}</b>. Students aiming for <b>${level}</b> are expected to master key terminology related to <b>${topic}</b>. By practicing this specific material, you demonstrate that your MIT App Inventor and WebViewer communication channel is functioning with 100% precision.`;

            const questions = [];
            
            // Tự động tạo 10 câu hỏi chứa đúng giá trị Trình độ và Chủ đề đã chọn
            for (let i = 1; i <= 10; i++) {
                let questionText = "";
                let answer = "A";
                let options = {};
                let explanation = "";

                if (i === 1) {
                    questionText = `What is the main subject discussed in this reading exercise?`;
                    options = { A: topic, B: "An unrelated general subject", C: "Traditional cooking methods", D: "Extreme outdoor sports" };
                    answer = "A";
                    explanation = `Đoạn văn nêu rõ chủ đề chính của bài luyện tập đọc hiểu này là về "${topic}".`;
                } else if (i === 2) {
                    questionText = `This custom mock reading passage is calibrated for which level?`;
                    options = { A: "Beginner Level (A1)", B: "Expert Level (C2)", C: `Calibrated Level: ${level}`, D: "Primary school level" };
                    answer = "C";
                    explanation = `Văn bản ghi nhận rõ ràng bài kiểm tra này được hiệu chuẩn ở trình độ "${level}".`;
                } else {
                    questionText = `Question ${i} (${topic}): Is mastering ${topic} helpful for students?`;
                    options = { A: "Yes, it is highly recommended for progress.", B: "No, it should be ignored.", C: "It is only a temporary distraction.", D: "No opinion." };
                    answer = "A";
                    explanation = `Theo nội dung văn bản: "mastering ${topic} is key to unlocking new global opportunities".`;
                }

                questions.push({
                    question: questionText,
                    A: options.A,
                    B: options.B,
                    C: options.C,
                    D: options.D,
                    answer: answer,
                    explanation: explanation
                });
            }

            return {
                title: simulatedTitle,
                passage: simulatedPassage,
                questions: questions
            };
        }

        // Hàm xử lý khi phát hiện tín hiệu cấu hình thay đổi từ điện thoại
        function handleConfigChange(level, topic) {
            const statusDiv = document.getElementById("status");
            statusDiv.innerHTML = `⚡ Đã bắt được tín hiệu! Đang khởi tạo đề thi mô phỏng cho <b>${level}</b> - <b>${topic}</b>...`;

            // Cập nhật giao diện khối nhận tín hiệu
            document.getElementById("received-level").innerText = level;
            document.getElementById("received-topic").innerText = topic;

            // Tự sinh đề thi mẫu offline ngay lập tức (Không tốn 1 mili-giây gọi API!)
            quizData = generateLocalMockQuiz(level, topic);
            renderQuiz();
            
            statusDiv.innerHTML = `✅ Kết nối thành công! Đã đồng bộ đề thi trình độ <b>${level}</b>.`;
        }

        // Hiển thị giao diện đề thi
        function renderQuiz() {
            let html = "";
            html += `
                <div class="bg-slate-900 border border-slate-850 rounded-2xl p-4 shadow-md space-y-3">
                    <h3 class="text-sm font-bold text-white leading-tight">${quizData.title}</h3>
                    <div class="text-xs text-slate-300 leading-relaxed bg-slate-950/70 p-3.5 rounded-xl border border-slate-800/80 font-serif">${quizData.passage}</div>
                </div>
            `;

            quizData.questions.forEach((q, index) => {
                html += `
                    <div class="bg-slate-900 border border-slate-850 rounded-2xl p-4 shadow-md space-y-3">
                        <p class="text-xs font-bold text-slate-100 leading-snug"><b>${index+1}. ${q.question}</b></p>
                        <div class="grid grid-cols-1 gap-2">
                            <label class="tap-scale flex items-center p-3 rounded-xl text-xs font-medium bg-slate-850 border border-slate-800 text-slate-300 cursor-pointer">
                                <input type="radio" name="q${index}" value="A" class="mr-3 accent-indigo-500">
                                A. ${q.A}
                            </label>
                            <label class="tap-scale flex items-center p-3 rounded-xl text-xs font-medium bg-slate-850 border border-slate-800 text-slate-300 cursor-pointer">
                                <input type="radio" name="q${index}" value="B" class="mr-3 accent-indigo-500">
                                B. ${q.B}
                            </label>
                            <label class="tap-scale flex items-center p-3 rounded-xl text-xs font-medium bg-slate-850 border border-slate-800 text-slate-300 cursor-pointer">
                                <input type="radio" name="q${index}" value="C" class="mr-3 accent-indigo-500">
                                C. ${q.C}
                            </label>
                            <label class="tap-scale flex items-center p-3 rounded-xl text-xs font-medium bg-slate-850 border border-slate-800 text-slate-300 cursor-pointer">
                                <input type="radio" name="q${index}" value="D" class="mr-3 accent-indigo-500">
                                D. ${q.D}
                            </label>
                        </div>
                        <div id="fb${index}"></div>
                    </div>
                `;
            });

            html += `
                <div class="bg-slate-900 border border-slate-850 rounded-2xl p-4 shadow-md text-center space-y-3">
                    <button onclick="gradeQuiz()" class="tap-scale w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-md">
                        Nộp Bài Chấm Điểm Thử
                    </button>
                    <div id="result" class="text-sm font-bold text-indigo-400"></div>
                </div>
            `;

            document.getElementById("quizArea").innerHTML = html;
        }

        // Chấm điểm và truyền kết quả ngược về điện thoại qua WebViewString
        function gradeQuiz() {
            let score = 0;

            quizData.questions.forEach((q, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                const fb = document.getElementById("fb" + index);

                if (selected) {
                    if (selected.value === q.answer) {
                        score++;
                        fb.className = "p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-[11px] text-emerald-400 mt-2";
                        fb.innerHTML = "<p class='font-bold'>✓ Đúng</p>";
                    } else {
                        fb.className = "p-3 bg-rose-500/10 border border-rose-500/20 rounded-xl text-[11px] text-rose-400 mt-2 space-y-1";
                        fb.innerHTML = `
                            <p class='font-bold'>✗ Chưa chính xác</p>
                            <p><b>Đáp án đúng:</b> <span class="text-emerald-400 font-bold">${q.answer}</span></p>
                            <p class="text-slate-400"><b>Giải thích:</b> ${q.explanation}</p>
                        `;
                    }
                } else {
                    fb.className = "p-3 bg-amber-500/10 border border-amber-500/20 rounded-xl text-[11px] text-amber-400 mt-2";
                    fb.innerHTML = "<p>⚠️ Bạn chưa chọn câu trả lời này!</p>";
                }
            });

            document.getElementById("result").innerHTML = `
                <h2 class="text-lg font-extrabold text-white">Điểm số: ${score}/10</h2>
                <p class="text-[10px] text-slate-400 mt-1">Chuỗi tin nhắn gửi về điện thoại: "DIEM:${score}/10"</p>
            `;

            sendResultToMIT(score, 10);

            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: 'smooth'
            });
        }

        function sendResultToMIT(score, total) {
            const dataString = "DIEM:" + score + "/" + total;
            if (window.AppInventor && window.AppInventor.setWebViewString) {
                window.AppInventor.setWebViewString(dataString);
            }
        }

        // Vòng lặp kiểm tra tín hiệu từ điện thoại liên tục 500ms
        function checkConnection() {
            const params = parseParameters();
            
            if (params.level !== "Chưanhận" && params.topic !== "Chưanhận") {
                const currentConfigStr = `${params.level}|${params.topic}`;
                if (currentConfigStr !== lastReceivedConfig) {
                    lastReceivedConfig = currentConfigStr;
                    currentLevel = params.level;
                    currentTopic = params.topic;
                    
                    // Kích hoạt sinh đề thi mẫu theo cấu hình thực tế nhận được!
                    handleConfigChange(currentLevel, currentTopic);
                }
            }
        }

        setInterval(checkConnection, 500);
        checkConnection();
    </script>

</body>
</html>
