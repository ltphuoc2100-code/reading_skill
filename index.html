<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reading Practice</title>

<style>
body{
font-family:Arial;
max-width:900px;
margin:auto;
padding:15px;
background:#f5f5f5;
}

.card{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:15px;
}

button{
padding:10px;
font-size:16px;
width:100%;
}

.question{
margin-top:20px;
}
</style>
</head>

<body>

<div class="card">
<h2>AI Reading Practice</h2>
<p id="info"></p>
<div id="status">Generating quiz...</div>
</div>

<div id="quizArea"></div>

<script>

const API_KEY = "AIzaSyAJPtlIAIxPv-zyfhqUwxiOikRmDKcdpKo";

const params = new URLSearchParams(window.location.search);

const level = params.get("level") || "A2";
const topic = params.get("topic") || "Travel";

document.getElementById("info").innerHTML =
"Level: " + level + " | Topic: " + topic;

let quizData = null;

async function createQuiz(){

const prompt = `
Create an English reading comprehension test.

Level: ${level}

Topic: ${topic}

Generate:

- one reading passage
- exactly 10 multiple choice questions

Return ONLY valid JSON.

{
"title":"",
"passage":"",
"questions":[
{
"question":"",
"A":"",
"B":"",
"C":"",
"D":"",
"answer":"",
"explanation":""
}
]
}
`;

try{

const response = await fetch(
"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="+API_KEY,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
contents:[
{
parts:[
{
text:prompt
}
]
}
]
})
}
);

const result = await response.json();

let text =
result.candidates[0].content.parts[0].text;

text = text.replace(/```json/g,"");
text = text.replace(/```/g,"");

quizData = JSON.parse(text);

renderQuiz();

}
catch(err){

document.getElementById("status").innerHTML =
"Error: " + err.message;

}

}

function renderQuiz(){

document.getElementById("status").style.display =
"none";

let html = "";

html += `
<div class="card">
<h2>${quizData.title}</h2>
<p>${quizData.passage}</p>
</div>
`;

quizData.questions.forEach((q,index)=>{

html += `
<div class="card question">

<p><b>${index+1}. ${q.question}</b></p>

<label>
<input type="radio" name="q${index}" value="A">
A. ${q.A}
</label><br><br>

<label>
<input type="radio" name="q${index}" value="B">
B. ${q.B}
</label><br><br>

<label>
<input type="radio" name="q${index}" value="C">
C. ${q.C}
</label><br><br>

<label>
<input type="radio" name="q${index}" value="D">
D. ${q.D}
</label>

<div id="fb${index}"></div>

</div>
`;

});

html += `
<div class="card">
<button onclick="gradeQuiz()">
Submit Answers
</button>
<div id="result"></div>
</div>
`;

document.getElementById("quizArea").innerHTML =
html;

}

function gradeQuiz(){

let score = 0;

quizData.questions.forEach((q,index)=>{

const selected =
document.querySelector(
'input[name="q'+index+'"]:checked'
);

const fb =
document.getElementById("fb"+index);

if(selected){

if(selected.value === q.answer){

score++;

fb.innerHTML =
"<p style='color:green'>✓ Correct</p>";

}else{

fb.innerHTML =
"<p style='color:red'>✗ Incorrect</p>"
+
"<p>Correct answer: "
+
q.answer
+
"</p><p>"
+
q.explanation
+
"</p>";

}

}

});

document.getElementById("result").innerHTML =
"<h2>Score: "+score+"/10</h2>";

window.scrollTo(
0,
document.body.scrollHeight
);

}

createQuiz();

</script>

</body>
</html>
