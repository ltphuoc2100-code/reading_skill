<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACE READING SKILLS 📚</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --secondary-color: #F5A623;
            --success-color: #2ECC71;
            --danger-color: #E74C3C;
            --text-main: #2C3E50;
            --text-muted: #7F8C8D;
            --bg-light: #F8FAFC;
            --card-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.6;
            padding: 12px;
        }

        /* KHỐI 1: Màn hình chào */
        #welcome-message-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .welcome-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px 16px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #E2E8F0;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
        }

        .welcome-title {
            color: #E74C3C;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        /* KHỐI 2: Khung hình ảnh trường */
        #welcome-image-block {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .school-image-container {
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #E2E8F0;
            background: var(--card-bg);
            padding: 6px;
            margin-bottom: 20px;
        }

        .school-image {
            width: 100%;
            height: auto;
            max-height: 240px;
            object-fit: cover;
            border-radius: 12px;
            display: block;
        }

        /* Khối thông báo lỗi kết nối */
        #status-container {
            display: none;
            width: 100%;
            max-width: 500px;
            margin: 0 auto 16px auto;
        }

        .alert-box {
            background: #FFF5F5;
            border: 1px solid #FEB2B2;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .btn-rescue {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Khung hiển thị nội dung bài đọc chính thức */
        #content-container {
            display: none;
            max-width: 650px;
            margin: 0 auto;
        }

        .reading-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border: 1px solid #E2E8F0;
            margin-bottom: 16px;
        }

        .article-title {
            font-size: 20px;
            font-weight: 700;
            color: #1E293B;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 2px solid #EDF2F7;
        }

        .article-text {
            font-size: 15px;
            color: #334155;
            text-align: justify;
            white-space: pre-line;
        }

        /* Khối giao diện Câu hỏi */
        .quiz-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border: 1px solid #E2E8F0;
        }

        .question-block {
            display: none;
        }

        .question-block.active {
            display: block;
        }

        .question-text {
            font-size: 15px;
            font-weight: 600;
            color: #2D3748;
            margin-bottom: 14px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        /* ẨN HOÀN TOÀN NÚT TRÒN THEO Ý THẦY */
        .option-item input[type="radio"] {
            display: none !important;
        }

        /* Biến câu trả lời thành dạng thẻ hộp nút bấm */
        .option-item {
            display: block;
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            color: #4A5568;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        /* Khi chọn đáp án */
        .option-item:has(input[type="radio"]:checked) {
            background-color: #E6F0FA;
            border-color: #4A90E2;
            color: #0056B3;
            font-weight: 600;
        }

        /* THANH ĐIỀU HƯỚNG CÙNG MỘT HÀNG NGANG CHUẨN Ý THẦY */
        .quiz-navigation-bar {
            display: flex !important;
            flex-direction: row !important;
            justify-content: space-between !important;
            align-items: center !important;
            border-top: 1px dashed #E2E8F0;
            padding-top: 14px;
            margin-top: 10px;
            width: 100%;
        }

        .nav-indicator {
            font-size: 14px;
            font-weight: 700;
            color: #7F8C8D;
            white-space: nowrap;
        }

        .btn-nav {
            background-color: #F1F5F9;
            color: #334155;
            border: 1px solid #CBD5E1;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            min-width: 80px;
            text-align: center;
        }

        .btn-nav:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .footer-credit {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <div id="welcome-message-block">
        <div class="welcome-card">
            <h1 class="welcome-title">Welcome to Reading Comprehension</h1>
            <p style="color: #334155; font-size: 14px;">Please choose <strong>Level</strong> and <strong>Topic</strong> on the top, then click the <strong>Read up</strong> button to practise!</p>
        </div>
    </div>
        
    <div id="welcome-image-block">
        <div class="school-image-container">
            <img src="Picture1.png" alt="School" class="school-image">
        </div>
    </div>

    <div id="status-container">
        <div class="alert-box">
            <div style="color:var(--danger-color); font-weight:700; margin-bottom:8px;">❌ Connection Failed</div>
            <div style="font-size:13px; color:#742A2A; margin-bottom:12px;">The AI Engine could not be initialized. Please check your configuration.</div>
            <button class="btn-rescue" onclick="forceLoadOffline()">Load Standard Offline Quiz Instead</button>
        </div>
    </div>

    <div id="content-container">
        <div class="reading-card">
            <h2 class="article-title" id="render-title"></h2>
            <div class="article-text" id="render-text"></div>
        </div>

        <div class="quiz-card">
            <div id="render-questions"></div>
            
            <div class="quiz-navigation-bar">
                <button type="button" class="btn-nav" id="btn-prev-quiz" onclick="navigateQuestion(-1)">Back</button>
                <div class="nav-indicator" id="quiz-page-indicator">Question 1/10</div>
                <button type="button" class="btn-nav" id="btn-next-quiz" onclick="navigateQuestion(1)">Next</button>
            </div>
        </div>
    </div>

    <div class="footer-credit">Enhancing Reading Comprehension by Le Thien Phuoc</div>

    <script>
        const API_KEY_PART1 = "AQ.Ab8RN6"; 
        const API_KEY_PART2 = "ImY3ZbsE2FEM74MWeKIfWJLC2XGWdmcOs9Fdg-LxF7nw"; 

        let currentQuestionIndex = 0;
        let totalQuestionsCount = 0;

        const OFFLINE_DATABASE = {
            "B1": {
                "Music": {
                    "title": "Echoes of Emotion: How Music Shapes the Teenage Brain",
                    "text": "Music is a universal language that affects people deeply. For teenagers, it is more than entertainment; it is a tool for self-expression. Neurological studies show that listening to upbeat songs stimulates the production of dopamine, a chemical linked to happiness. Many adolescents use playlists to manage stress after school. When students listen to classical melodies, their concentration levels increase significantly.",
                    "questions": [
                        {"q": "What is the main idea of the passage?", "a": "The impact of music on teenagers' emotions and brains.", "b": "The history of classical music in education.", "c": "How technology changed the music industry.", "d": "The popularity of streaming platforms.", "ans": "a"},
                        {"q": "According to the text, what chemical is released when listening to upbeat music?", "a": "Adrenaline", "b": "Melatonin", "c": "Dopamine", "d": "Cortisol", "ans": "c"},
                        {"q": "Which type of music can potentially cause anxiety according to the text?", "a": "Classical melodies", "b": "Aggressive tracks", "c": "Upbeat songs", "d": "Traditional tunes", "ans": "b"}
                    ]
                }
            }
        };

        function getURLParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        window.addEventListener('DOMContentLoaded', () => {
            // ĐỘ TRỄ CHUẨN ĐỂ NHẬN THAM SỐ TỪ APP INVENTOR
            setTimeout(() => {
                const lvl = getURLParam('level');
                const tpc = getURLParam('topic');

                if (!lvl || !tpc) {
                    document.getElementById('welcome-message-block').style.display = 'flex';
                    document.getElementById('welcome-image-block').style.display = 'flex';
                    document.getElementById('content-container').style.display = 'none';
                    return;
                }
                
                hideWelcomeElements();
                executeMainPipeline(lvl, tpc);
            }, 500); 
        });

        function hideWelcomeElements() {
            document.getElementById('welcome-message-block').style.display = 'none';
            document.getElementById('welcome-image-block').style.display = 'none';
        }

        async function executeMainPipeline(level, topic) {
            hideWelcomeElements();

            let urlPart2 = getURLParam('key_part2') || "";
            let finalPart2 = (API_KEY_PART2 && API_KEY_PART2.trim() !== "") ? API_KEY_PART2 : urlPart2;

            if (!API_KEY_PART1 || API_KEY_PART1.trim() === "" || !finalPart2 || finalPart2.trim() === "") {
                triggerErrorState();
                return;
            }

            try {
                const obfuscatedURL = ["=yek?tnetnoCetanereg:hsalf-5.1-inimeg/sledom/atebv1/moc.sielpaegaugnalvitaneg//:sptth"];
                const baseEndpoint = obfuscatedURL[0].split("").reverse().join("");
                const apiURL = baseEndpoint + API_KEY_PART1 + finalPart2;
                
                // ĐÃ BỔ SUNG LẠI PROMPT CHUẨN ĐỂ AI KHÔNG BỊ PHẢN ỨNG TRƠ
                const promptText = `You are an expert ESL test creator. Create an English reading comprehension test for Level: ${level} and Topic: ${topic}.
Return ONLY a valid JSON object. Do not include markdown code blocks. Use this exact JSON template:
{
  "title": "Academic Title Here",
  "text": "Full reading passage HTML here...",
  "questions": [
    {"q": "Question text here", "a": "Option A", "b": "Option B", "c": "Option C", "d": "Option D", "ans": "correct_option_letter"}
  ]
}`;

                const response = await fetch(apiURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
                });

                if (!response.ok) throw new Error("Lỗi kết nối");

                const responseData = await response.json();
                let rawText = responseData.candidates[0].content.parts[0].text.trim();
                
                if (rawText.startsWith("```json")) rawText = rawText.substring(7);
                if (rawText.startsWith("```")) rawText = rawText.substring(3);
                if (rawText.endsWith("```")) rawText = rawText.substring(0, rawText.length - 3);
                
                const cleanData = JSON.parse(rawText.trim());
                renderExamContent(cleanData);

            } catch (error) {
                console.error(error);
                triggerErrorState();
            }
        }

        function triggerErrorState() {
            hideWelcomeElements();
            document.getElementById('content-container').style.display = 'none';
            document.getElementById('status-container').style.display = 'block';
        }

        function forceLoadOffline() {
            const level = getURLParam('level') || "B1";
            const topic = getURLParam('topic') || "Music";
            let dataset = (OFFLINE_DATABASE[level] && OFFLINE_DATABASE[level][topic]) ? OFFLINE_DATABASE[level][topic] : OFFLINE_DATABASE["B1"]["Music"];
            renderExamContent(dataset);
        }

        function renderExamContent(data) {
            hideWelcomeElements(); 
            document.getElementById('status-container').style.display = 'none';
            
            document.getElementById('render-title').innerHTML = data.title;
            document.getElementById('render-text').innerHTML = data.text;

            let htmlQuestions = "";
            totalQuestionsCount = data.questions.length;
            currentQuestionIndex = 0;

            data.questions.forEach((item, index) => {
                const qNum = index + 1;
                htmlQuestions += `
                    <div class="question-block" id="question_block_${index}">
                        <div class="question-text">Question ${qNum}: ${item.q}</div>
                        <div class="options-grid">
                            <label class="option-item"><input type="radio" name="q_${qNum}" value="a">A. ${item.a}</label>
                            <label class="option-item"><input type="radio" name="q_${qNum}" value="b">B. ${item.b}</label>
                            <label class="option-item"><input type="radio" name="q_${qNum}" value="c">C. ${item.c}</label>
                            <label class="option-item"><input type="radio" name="q_${qNum}" value="d">D. ${item.d}</label>
                        </div>
                    </div>
                `;
            });

            document.getElementById('render-questions').innerHTML = htmlQuestions;
            updateQuestionVisibility();
            document.getElementById('content-container').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateQuestionVisibility() {
            for (let i = 0; i < totalQuestionsCount; i++) {
                const block = document.getElementById(`question_block_${i}`);
                if (block) {
                    if (i === currentQuestionIndex) {
                        block.classList.add('active');
                    } else {
                        block.classList.remove('active');
                    }
                }
            }

            document.getElementById('quiz-page-indicator').innerText = `Question ${currentQuestionIndex + 1}/${totalQuestionsCount}`;
            document.getElementById('btn-prev-quiz').disabled = (currentQuestionIndex === 0);
            document.getElementById('btn-next-quiz').disabled = (currentQuestionIndex === totalQuestionsCount - 1);
        }

        function navigateQuestion(direction) {
            const nextIdx = currentQuestionIndex + direction;
            if (nextIdx >= 0 && nextIdx < totalQuestionsCount) {
                currentQuestionIndex = nextIdx;
                updateQuestionVisibility();
            }
        }
    </script>
</body>
</html>
